name: CTI 4H Scanner Snapshot

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected scanner snapshot
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          
          curl -sS -i \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/snapshot"

